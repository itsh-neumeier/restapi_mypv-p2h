name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # See requirements_test.txt for why this is two layers.
          pip install --no-deps homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component
          pip install --prefer-binary -r requirements_test.txt
      - run: pytest tests/ -v
