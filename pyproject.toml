[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "ASYNC",# flake8-async
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.restapi_mypv_p2h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
